<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Brij Studio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      img-src allows https: so supporter avatars and gift thumbnails render
      (TikTok CDN and YouTube's googleusercontent/ytimg hosts). connect-src stays
      closed: TikTok and YouTube network traffic is owned by the main process,
      and the bridge talks over ws:/wss: only.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' ws: wss:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
